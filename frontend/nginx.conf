server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Service DNS names below resolve via docker-compose networking locally,
  # and via Kubernetes Service DNS (<name>.<namespace>.svc.cluster.local) in
  # GKE - the same nginx.conf works unmodified in both environments.

  location = /api/health/users {
    proxy_pass http://user-service:3001/health;
  }
  location /api/users {
    rewrite ^/api/users(.*)$ /users$1 break;
    proxy_pass http://user-service:3001;
  }

  location = /api/health/products {
    proxy_pass http://product-service:3002/health;
  }
  location /api/products {
    rewrite ^/api/products(.*)$ /products$1 break;
    proxy_pass http://product-service:3002;
  }

  location = /api/health/orders {
    proxy_pass http://order-service:3003/health;
  }
  location /api/orders {
    rewrite ^/api/orders(.*)$ /orders$1 break;
    proxy_pass http://order-service:3003;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
