apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: user-service
  namespace: microservices-demo
spec:
  selector:
    matchLabels:
      app: user-service
  endpoints:
    - port: 3001
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: product-service
  namespace: microservices-demo
spec:
  selector:
    matchLabels:
      app: product-service
  endpoints:
    - port: 3002
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: order-service
  namespace: microservices-demo
spec:
  selector:
    matchLabels:
      app: order-service
  endpoints:
    - port: 3003
      path: /metrics
      interval: 30s
